<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Корупціонер 2000</title></head><body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: ретро-робочий стіл у дусі SimCity 2000. Велике вікно з піксельною картою міста, поруч (на телефоні нижче) вікно з вкладками. Палітра Windows 3.1: сірі фаски, синя шапка вікна, бірюзовий стіл. */
:root{
  --desk:#2f6b73;
  --face:#c0c0c0;
  --hi:#ffffff;
  --mid:#dfdfdf;
  --lo:#808080;
  --dk:#404040;
  --navy:#000080;
  --sky:#1084d0;
  --ink:#000000;
  --lcd:#0b1d12;
  --lcdg:#5dff8a;
  --warn:#c01818;
  --ok:#0a7a2f;
  --gold:#ffd24a;
  --pix:'Press Start 2P','Courier New',monospace;
  --ui:Tahoma,'Segoe UI',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  background:var(--desk);color:var(--ink);font-family:var(--ui);font-size:13px;line-height:1.35;
  padding-block:12px 28px;
  padding-left:max(10px,env(safe-area-inset-left,0px));
  padding-right:max(10px,env(safe-area-inset-right,0px));
}
.desk{max-width:1180px;margin:0 auto;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media(min-width:960px){.desk{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:start}}
.win{background:var(--face);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--lo),inset 1px 1px var(--mid),3px 3px 0 rgba(0,0,0,.35);padding:3px;min-width:0}
.tb{background:linear-gradient(90deg,var(--navy),var(--sky));color:#fff;font:400 9px/1.2 var(--pix);padding:6px 7px;display:flex;justify-content:space-between;gap:8px;align-items:center;letter-spacing:.02em}
.sunk{border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);background:#fff;min-width:0}
.bar-top{display:flex;flex-wrap:wrap;gap:6px;padding:6px 3px 4px;align-items:stretch}
.cell{flex:1 1 92px;min-width:0;padding:3px 6px;background:var(--lcd);border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
.cell b{display:block;font:400 7px/1.3 var(--pix);color:#8fd6a5;text-transform:uppercase}
.cell span{display:block;font:400 11px/1.5 var(--pix);color:var(--lcdg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .bar{height:6px;background:#06130b;margin-top:2px;border:1px solid #2a5a3a}
.cell .bar i{display:block;height:100%}
.mapwrap{position:relative;height:min(64vh,560px);min-height:360px;background:#14242f;overflow:hidden;touch-action:none}
#map{display:block;width:100%;height:100%;image-rendering:pixelated;cursor:grab}
#map:active{cursor:grabbing}
#mini{position:absolute;right:6px;bottom:6px;width:120px;height:120px;image-rendering:pixelated;border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);background:#14242f;cursor:pointer}
.ctl{position:absolute;left:6px;top:6px;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 12px)}
.ctl.r{left:auto;right:6px;top:6px;justify-content:flex-end}
.news{display:flex;gap:8px;align-items:center;padding:4px 6px;min-height:30px;background:var(--face);font-size:12px}
.news .sunk{flex:1;padding:3px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.news .sunk.bad{color:var(--warn)}.news .sunk.good{color:var(--ok)}
button{font:inherit;color:var(--ink);cursor:pointer}
button:focus-visible{outline:2px dotted var(--ink);outline-offset:-5px}
.btn,.opt,.offer,.up,.tab,.fopb{background:var(--face);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--lo),inset 1px 1px var(--mid);padding:6px 10px;min-height:34px;text-align:left}
.btn:active:not(:disabled),.opt:active:not(:disabled),.offer:active:not(:disabled),.up:active:not(:disabled),.tab:active{border-color:var(--dk) var(--hi) var(--hi) var(--dk);box-shadow:inset 1px 1px var(--lo)}
.btn{font-weight:700;text-align:center}
.btn.small{min-height:28px;padding:3px 8px;font-size:12px}
.btn.primary{background:#9be0ac}
.btn.gold{background:var(--gold)}
.btn[aria-pressed="true"],.opt[aria-pressed="true"],.tab[aria-selected="true"]{border-color:var(--dk) var(--hi) var(--hi) var(--dk);box-shadow:inset 1px 1px var(--lo);background:#ffe9a0}
.btn:disabled,.opt:disabled,.up:disabled,.offer:disabled{color:#808080;text-shadow:1px 1px #fff;cursor:not-allowed}
.btn.sq{min-height:30px;min-width:32px;padding:2px 8px;font-size:15px;line-height:1}
.tabs{display:flex;flex-wrap:wrap;gap:3px;padding:6px 3px 0}
.tab{min-height:30px;padding:4px 8px;font-size:12px;font-weight:700;text-align:center;flex:1 1 auto}
.pane{padding:8px 6px;display:grid;gap:8px;align-content:start}
.pane[hidden]{display:none}
.list{display:grid;gap:6px}
.offer{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%}
.offer .l{min-width:0}
.offer b,.opt b,.up b{font-weight:700}
.offer small,.opt small,.up small{display:block;color:#404040;font-size:11px}
.offer .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ok)}
.offer .loc{flex:none}
.tag{display:inline-block;font-size:10px;font-weight:700;border:1px solid var(--ink);padding:0 5px;margin-right:5px;background:#fff;vertical-align:1px}
.tag.t-direct{background:#b9f0c6}.tag.t-tender{background:#ffe08a}.tag.t-auction{background:#d6c8ff}
.opt{width:100%}
.up{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%}
.up.own{background:#b9f0c6}
.note{margin:0;color:#404040;font-size:12px}
.fop{display:grid;gap:4px;padding:6px;background:#fff;border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
.fop .row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.pb{height:10px;background:#fff;border:1px solid var(--ink)}
.pb i{display:block;height:100%;background:var(--ok)}
.heat{font-size:11px;font-weight:700}.heat.hot{color:var(--warn)}
#castle{display:block;width:100%;max-width:440px;margin:0 auto;image-rendering:pixelated;background:#7fb0d6;border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
#log{list-style:none;margin:0;padding:0;display:grid;gap:4px}
#log li{padding:4px 6px;background:#fff;border:1px solid var(--lo);font-size:12px}
#log li.bad{background:#ffd9d4}#log li.good{background:#d4f2dc}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:12px;z-index:20;overflow:auto}
.overlay[hidden]{display:none}
.modal{background:var(--face);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--lo),inset 1px 1px var(--mid),5px 5px 0 rgba(0,0,0,.4);max-width:540px;width:100%;padding:3px;max-height:calc(100% - 8px);overflow:auto}
.modal .in{padding:10px 10px 12px}
.modal h3{margin:0;background:linear-gradient(90deg,var(--navy),var(--sky));color:#fff;font:400 10px/1.4 var(--pix);padding:7px 8px}
.modal p{margin:0 0 8px}
.modal .sub{color:#404040;font-size:12px}
.sec{margin:10px 0 5px;font:400 8px/1.4 var(--pix);color:#404040;text-transform:uppercase}
.sum{background:#fff;border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);padding:6px 8px;font-variant-numeric:tabular-nums;font-size:13px}
.sum div{display:flex;justify-content:space-between;gap:10px}
.sum .tot{font-weight:700;border-top:1px solid var(--ink);margin-top:4px;padding-top:4px}
.pos{color:var(--ok)}.neg{color:var(--warn)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.acts .btn{flex:1 1 140px}
</style>

<div class="desk">
  <section class="win" aria-label="Карта міста">
    <div class="tb"><span>Корупціонер 2000 · Київ</span><span id="rank">ФОП-початківець</span></div>
    <div class="bar-top" id="meters"></div>
    <div class="sunk mapwrap" id="mapwrap">
      <canvas id="map" aria-label="Піксельна карта Києва. Перетягуй, щоб рухати камеру. Тицяй на знак оклику, щоб взяти замовлення."></canvas>
      <div class="ctl" id="zoomctl"><button class="btn sq" data-z="1" aria-label="Наблизити">+</button><button class="btn sq" data-z="-1" aria-label="Віддалити">−</button><button class="btn sq" data-home="1" aria-label="До свого району" title="До свого району">⌂</button></div>
      <div class="ctl r" id="speed" role="group" aria-label="Швидкість часу"></div>
      <canvas id="mini" width="80" height="80" aria-label="Мінікарта міста"></canvas>
    </div>
    <div class="news"><b id="monthL">Місяць 1</b><div class="sunk" id="news"></div></div>
  </section>

  <section class="win" aria-label="Панель керування">
    <div class="tb"><span>Бюро справ</span></div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="pane" id="pane-offers" role="tabpanel"><div class="list" id="offers"></div><p class="note" id="offerNote"></p></div>
    <div class="pane" id="pane-fops" role="tabpanel" hidden><div class="list" id="fops"></div></div>
    <div class="pane" id="pane-career" role="tabpanel" hidden><div id="career"></div></div>
    <div class="pane" id="pane-castle" role="tabpanel" hidden>
      <canvas id="castle" width="144" height="112" aria-label="Будинок родини, який дорослішає за заробіток"></canvas>
      <p id="mood" class="note"></p>
      <div class="list" id="upgrades"></div>
    </div>
    <div class="pane" id="pane-log" role="tabpanel" hidden><ul id="log"></ul></div>
  </section>
</div>

<div class="overlay" id="dealWrap" hidden role="dialog" aria-modal="true" aria-labelledby="dealTitle"><div class="modal" id="deal"></div></div>
<div class="overlay" id="auWrap" hidden role="dialog" aria-modal="true" aria-labelledby="auTitle"><div class="modal" id="audit"></div></div>
<div class="overlay" id="elWrap" hidden role="dialog" aria-modal="true" aria-labelledby="elTitle"><div class="modal" id="elect"></div></div>
<div class="overlay" id="end" hidden role="dialog" aria-modal="true" aria-labelledby="endTitle">
  <div class="modal"><h3 id="endTitle"></h3><div class="in">
    <p id="endText"></p><p id="endScore" style="font-weight:700"></p>
    <button class="btn primary" id="again" style="width:100%">Ще раз</button>
  </div></div>
</div>

<script>
(function(){
'use strict';
var N=80, HOME={x:58,y:34}, ZR=[10,16,26,400];
var $=function(id){return document.getElementById(id)};
var mc=$('map'), mx=mc.getContext('2d');
var mini=$('mini'), mnx=mini.getContext('2d');
var cc=$('castle'), cx2=cc.getContext('2d');
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var PS=2;                       /* css-пікселів на піксель картинки */
var SW=32, SH=60, SOY=44;       /* розмір спрайта клітинки і висота вершини ромба */

var ROAD_H=['вул. Каштанова','вул. Подільська','бульв. Дружби','вул. Липська','просп. Лісовий','вул. Сирецька','пров. Ярославів','вул. Борщагівська','вул. Лісна','вул. Озерна'];
var ROAD_V=['просп. Берестейський','вул. Лугова','вул. Дубова','вул. Зарічна','вул. Академічна','вул. Харківська','вул. Вишнева','вул. Лівобережна','вул. Осокорська','вул. Трисвятська'];
var BASE={R:60,Y:70,H:170,S:240,P:130,B:400};
var RANKS=['ФОП-початківець','Підрядник','Директор КП','Депутат Київради'];
var MONTHS=['Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень','Січень','Лютий'];
var TIERS=[
  {n:'Чесно',cost:.78,q:.95,fame:2,d:'Як у кошторисі. Прибуток тонкий, зате ремонт живе довго.'},
  {n:'Економно',cost:.55,q:.6,fame:1,d:'Тонший шар, дешевша суміш. Років на два.'},
  {n:'Халтура',cost:.3,q:.25,fame:0,d:'Присипали і втрамбували. До першого дощу.'}
];
var BRIBES=[0,.1,.2];
var FOP_LIMIT=150;
var FOP_NAMES=['ФОП Тітка Валя','ФОП Кум Степан','ФОП Сусід Борис','ФОП Теща','ФОП Шурін Едік'];
var UPG=[
  {k:'fence',n:'Триметровий паркан',c:300},
  {k:'pool',n:'Басейн з підігрівом',c:600},
  {k:'lions',n:'Леви біля ґанку',c:400},
  {k:'toilet',n:'Золотий унітаз',c:500},
  {k:'heli',n:'Вертолітний майданчик',c:1200}
];
var MOOD=[
  'Родина ще в двокімнатній. Дружина вже склала список.',
  'Фундамент є. Сусіди питають, що це будується.',
  'Діти питають, звідки гроші. Їм кажуть: «Бабуся».',
  'Це вже не дім, це заява про наміри.',
  'З вертольотного майданчика добре видно, як хтось знімає це на телефон.',
  'Усе готово. Тільки золотий унітаз трохи холодний.'
];
var EL={
  agit:{n:'Агітація і банери',c:50,pts:8,rk:0,d:'Чесно, нудно, дорого.'},
  buck:{n:'Гречка по двох будинках',c:80,pts:14,rk:10,d:'Прямий підкуп виборців. Працює, а потім згадують.'},
  tech:{n:'Технічний кандидат',c:60,pts:0,rival:8,rk:5,d:'Однофамілець головного суперника, щоб голоси розійшлись.'},
  admin:{n:'Адмінресурс',c:0,pts:10,rk:6,d:'Працівники КП «добровільно» прийшли на мітинг.'}
};
var FLEE_COST=1000, MONTH_MS=40000;
var KIND={direct:'прямий договір',tender:'тендер',auction:'аукціон'};
var GATE={direct:'Начальник ЖЕКу',tender:'Тендерний комітет КП',auction:'Комісія з МАФів'};
var LOSE=['Договір дістався племіннику начальника.','Хтось запропонував більше, ніж ти.','«Ми вас почули. Ми вам передзвонимо».','Тендер скасували, і через тиждень оголосили такий самий.'];

var DEC={
  bench:{n:'Лавочки',base:25,real:.3,hint:'Лавка в закупівлі коштує як гарний гаманець, а в кошторисі як мотоцикл.'},
  lamp:{n:'Ліхтарі',base:40,real:.4,hint:'Ліхтар «розумний», хоча світить так само. Різниця йде в кишеню.'},
  curb:{n:'Бордюри',base:35,real:.5,hint:'Бордюри перекладають щороку, ніби їх хтось крадe. Хтось і краде.'},
  play:{n:'Дитячий майданчик',base:90,real:.45,hint:'Гірка з «сертифікованого» металу. Сертифікат справжній, метал ні.'},
  stop:{n:'Зупинка',base:140,real:.5,hint:'Скляна «смарт-зупинка» без смарту й без скла. Але тендер є.'},
  fountain:{n:'Фонтан',base:380,real:.35,hint:'Фонтан працює два тижні в рік, акт підписано на дванадцять місяців.'},
  led:{n:'LED-освітлення проспекту',base:450,real:.4,hint:'Енергозбереження на папері, а лампочки колишні.'},
  mon:{n:'Пам\'ятник',base:900,real:.25,hint:'Бронза за ціною золота, виливають із чого знайдуть. Приймають усі.'}
};
var EQ={truck:{n:'Самоскид',c:60,use:'двори, майданчики'},exc:{n:'Екскаватор',c:110,use:'сквери, фонтани, двори'},paver:{n:'Асфальтоукладальник',c:160,use:'дороги'},crane:{n:'Автокран',c:220,use:'мости, школи, фасади, ЖК'}};
function reqEq(o){if(o.kind!=='tender')return null;if(o.dec)return {stop:'crane',fountain:'exc',led:'crane',mon:'crane',play:'truck'}[o.dec]||'truck';if(o.dev)return 'crane';if(o.t==='H'&&o.bt==='house')return 'truck';return {R:'paver',B:'crane',H:'crane',S:'crane',P:'exc',Y:'exc'}[o.t]||null;}
function eqN(){return Object.keys(S.eq||{}).filter(function(k){return S.eq[k]}).length}
function eqHeat(){var n=eqN();return n>=3?.35:(n===2?.45:(n===1?.6:1))}
function eqTag(o){var k=reqEq(o);return k?'<span class="tag" style="background:'+(S.eq[k]?'#b9f0c6':'#ffd9d4')+'">'+EQ[k].n+(S.eq[k]?' ✓':'')+'</span>':''}
var ANN={
  roads:{n:'Утримання доріг району',base:600,eq:['paver','truck'],tiles:'RB',minRank:1},
  parks:{n:'Утримання скверів і дворів',base:350,eq:['exc','truck'],tiles:'PY',minRank:1},
  schools:{n:'Ремонт і утримання шкіл',base:450,eq:['crane','truck'],tiles:'S',minRank:1},
  winter:{n:'Зимове утримання: сніг і реагенти',base:300,eq:['truck','exc'],tiles:'',minRank:1},
  lights:{n:'Освітлення району на рік',base:500,eq:['crane','truck'],tiles:'',minRank:2}
};
var TERMS={
  M:{n:'щомісяця, по 1/12',b:0,d:'Гроші приходять щомісяця рівними частинами.'},
  Q:{n:'щокварталу',b:.08,d:'Чотири платежі: після 3, 6, 9 і 12 місяців.'},
  H:{n:'двома траншами',b:.15,d:'Половина через пів року, решта через рік.'},
  E:{n:'в кінці року',b:.25,d:'15% авансу, решта через 12 місяців. Усі витрати щомісяця на тобі.'}
};
var AN=null;
function annTotal(a){return Math.round(a.budget*(1+TERMS[a.term].b))}
function annMCost(a,tier){return Math.round(a.budget/12*TIERS[tier].cost*.8)}
function annChance(a,ap){return clamp(.18+S.contacts*.003+ap.bribe*1.3+(ap.tailor?.22:0)+(ap.docs?.08:0)-a.comp,.05,.9)}
function annLeft(a){return a.deadline-S.month}
function hasCo(){return S.fops.some(function(f){return f.isCo})}
function annualTick(){
  var live=[],lines=[];
  S.annual.forEach(function(a){if(S.month>=a.deadline)resolveAnnual(a,lines);else live.push(a);});
  S.annual=live;
  if(lines.length)S.notes.push({title:'Підсумки річних тендерів',lines:lines});
  if((S.month-1)%12===8){
    var r=Math.random;
    Object.keys(ANN).forEach(function(k){
      if(ANN[k].minRank>S.rank&&ANN[k].minRank>1)return;
      var x=r(),term=x<.35?'M':(x<.6?'Q':(x<.8?'H':'E'));
      S.annual.push({id:++S.annId,type:k,title:ANN[k].n,budget:r5(ANN[k].base*mult()*rnd(.9,1.15)),term:term,comp:rnd(.15,.3),deadline:S.month+3,applied:null});
    });
    S.notes.push({title:'Оголошено річні тендери',lines:['Місто оголосило рамкові тендери на цілий рік. Заявки приймають ще 3 місяці.','Потрібні ТОВ, певна техніка й живі гроші на забезпечення. Умови оплати різні: хтось платить щомісяця, а хтось через рік.']});
    addLog('Оголошено річні тендери. Подавай заявки до місяця '+(S.month+3)+'.','good');
  }
}
function resolveAnnual(a,lines){
  var ap=a.applied;if(!ap)return;
  S.cash+=ap.lock;

  }

  if(S.castle.length>=2&&Math.random()<Math.min(.3,.05*S.castle.length+(S.rank>=2?.05:0)))S.audits.push({kind:'life',f:null,fine:S.castle.length*60});
  S.audits=S.audits.slice(0,1);
  if(bad&&Math.random()<Math.min(.55,bad*.14)){S.risk=clamp(S.risk+9,0,100);addLog(Math.random()<.5?'Журналіст зняв відео про твій «ремонт»: яма вже там, де був асфальт.':'Журналіст порахував: лавка в кошторисі коштує як мотоцикл, а стоїть як табуретка.','bad');}
  if(weak.length&&Math.random()<.25){
    var w=weak[(Math.random()*weak.length)|0];w.c=8;w.sk=null;S.risk=clamp(S.risk+7,0,100);S.angry+=2;
    addLog('Провалилось: '+w.name+'. Пісок замість бетону не витримав.','bad');
  }
  if(S.inflate>0){
    if(Math.random()<Math.min(.5,S.inflate*.12)){S.risk=clamp(S.risk+14,0,100);S.inflate*=.7;addLog('Держаудит перевірив акти: обсяги не збігаються з реальністю.','bad');}
    else S.inflate*=.85;
  }
  if(S.devs&&Math.random()<Math.min(.4,.1*S.devs)){S.risk=clamp(S.risk+5,0,100);S.contacts=Math.max(0,S.contacts-1);addLog('Мешканці забудованих кварталів подали до суду: дозволів на ЖК не знайшли ані вони, ані ти.','bad');}
  updateRating();
  var rt=S.rt;
  if(rt<35&&Math.random()<.3){S.risk=clamp(S.risk+5,0,100);S.contacts=Math.max(0,S.contacts-2);addLog('Мешканці вийшли під райадміністрацію. На плакатах твоє прізвище майже не видно.','bad');}
  S.angry*=.93;
  S.risk=clamp(S.risk-2.5-(rt>60?1:0)+S.castle.length*1.2,0,100);
  genOffers();dirtyMini=true;
  var elect=((S.month-1)%12===0&&S.month>1);
  check();ui();
  if(elect&&!S.over){
    if(S.rank>=2)openElection();
    else addLog('Вибори до Київради пройшли без тебе. Ти ще не в грі.','');
    ui();
  }
  maybeAudit();
}
function check(){
  if(S.over)return;
  if(S.risk>=100)return finish('caught');
  if(S.month>8&&S.rt<6)return finish('riot');
  if(S.castle.length===UPG.length)return finish('win');
}
function finish(k){
  S.over=true;$('auWrap').hidden=true;closeDeal();$('elWrap').hidden=true;
  var T={
    caught:['За вами приїхали','Журналісти, перевірки й чиїсь діти з телефонами зробили свою справу. Ухвалу почали читати з золотого унітаза.'],
    riot:['Район повстав','Настрій упав майже до нуля. Люди вийшли на вулиці, які ти так і не полатав.'],
    win:['Пшонок-замок збудовано','Паркан, леви, басейн, золотий унітаз і вертоліт. Район у ямах, родина щаслива. Сумнівно, що надовго.'],
    flee:['Валіза зібрана','Ти в аеропорту з готівкою. Район лишився з ямами, а замок так і не добудований.']
  }[k];
  $('endTitle').textContent=T[0];$('endText').textContent=T[1];
  $('endScore').textContent='Місяців: '+S.month+' · Ранг: '+RANKS[S.rank]+' · Готівка: '+Math.round(S.cash)+' тис. · Замок: '+S.castle.length+'/'+UPG.length;
  $('end').hidden=false;$('again').focus();ui();
}

/* ================= ВИБОРИ ================= */
function baseSupport(){return S.rt*.3+Math.min(S.fame,40)*.6+S.contacts*.15}
function electStats(){
  var pts=0,rv=0,cost=0,rk=0;
  Object.keys(EL).forEach(function(k){if(E.pick[k]){var e=EL[k];pts+=e.pts;rv+=(e.rival||0);cost+=e.c;rk+=e.rk;}});
  var wins=0,b=baseSupport();
  for(var i=0;i<400;i++){if(b+pts+rnd(0,12)>40+(S.rank===3?6:0)+rnd(0,25)-rv)wins++;}
  return {pts:pts,rv:rv,cost:cost,rk:rk,p:Math.round(wins/4)};
}
function openElection(){E={pick:{agit:false,buck:false,tech:false,admin:false}};$('elWrap').hidden=false;renderElection();}
function renderElection(){
  var st=electStats(),h='<h3 id="elTitle">Вибори до Київради</h3><div class="in">';
  h+='<p class="sub">'+(S.rank===3?'Переобрання. Втратиш місце, якщо програєш.':'Мажоритарний округ. Хто купив більше голосів і побачив більше афіш, той і виграв.')+'</p>';
  h+='<div class="sec">Кампанія</div><div class="list">';
  Object.keys(EL).forEach(function(k){
    var e=EL[k];
    h+='<button class="opt" data-e="'+k+'" aria-pressed="'+E.pick[k]+'"><b>'+e.n+(e.c?' · '+e.c+' тис.':' · безкоштовно')+'</b><small>'+e.d+(e.rk?' Підозра +'+e.rk+'.':'')+'</small></button>';
  });
  h+='</div><div class="sum" style="margin-top:10px"><div><span>Шанс перемоги</span><span class="'+(st.p>=50?'pos':'neg')+'">≈ '+st.p+'%</span></div><div><span>Витрати</span><span class="neg">−'+st.cost+' тис.</span></div><div class="tot"><span>Готівка після</span><span>'+Math.round(S.cash-st.cost)+' тис.</span></div></div>';
  h+='<div class="acts"><button class="btn primary" data-e="go"'+(S.cash<st.cost?' disabled':'')+'>Іти на вибори</button><button class="btn" data-e="skip">Не йти</button></div>';
  if(S.cash<st.cost)h+='<p class="note" style="margin-top:6px">Не вистачає готівки на кампанію.</p>';
  h+='</div>';
  $('elect').innerHTML=h;
}
function runElection(){
  var st=electStats();
  if(S.cash<st.cost)return;
  S.cash-=st.cost;S.risk=clamp(S.risk+st.rk,0,100);
  var sup=baseSupport()+st.pts+rnd(0,12),riv=40+(S.rank===3?6:0)+rnd(0,25)-st.rv;
  $('elWrap').hidden=true;
  if(sup>riv){
    if(S.rank<3){S.rank=3;addLog('Перемога! Ти депутат Київради. Тепер ухвалюєш бюджети, яких сам же й потребуєш. Твій район виріс.','good');}
    else addLog('Переобрано. Виборці або забули, або повірили.','good');
    S.fame+=5;S.contacts+=5;
  } else {
    if(S.rank===3){S.rank=2;addLog('Програв. Мандат втрачено, повертаєшся до КП.','bad');}
    else addLog('Програв. Суперник виявився гречанішим.','bad');
  }
  E=null;updateRating();genOffers();dirtyMini=true;check();ui();maybeAudit();
}

/* ================= ПОДАТКОВА ================= */
function auInfo(a){
  var T={
    fop:['Податкова: «'+(a.f?a.f.name:'')+'»','Прийшли без попередження. Просять показати техніку, працівників і пояснити обіг '+Math.round(a.f?a.f.lastUsed:0)+' тис. за місяць. '+((a.f&&a.f.name!=='ФОП Ви')?'Пояснень немає, але «'+a.f.name+'» підписала все, не читаючи.':'Пояснень немає. ФОП оформлений на тебе, тож тітку тут не обійдеш: свідчити доведеться самому.')],
    co:['Податкова: ТОВ «Ви і Ко»','Розбіжності в ПДВ і податкових накладних: у договорах гроші є, а працівників нема. Донараховують штраф.'],
    life:['Перевірка декларації','Родина живе краще, ніж задекларовано: паркан, леви, золоті унітази. Просять пояснити, звідки. «Бабуся» уже не годиться.']
  }[a.kind];
  return {title:T[0],text:T[1],lawCost:a.kind==='life'?90:70,pLaw:clamp(.55+(S.rank>=1?.1:0),0,.8),brCost:Math.max(20,Math.round(a.fine*.7)),pBr:clamp(.55+S.contacts*.005,.55,.85)};
}
function maybeAudit(){if(S.over||!$('auWrap').hidden||!$('elWrap').hidden||!$('dealWrap').hidden)return;if(S.audits.length)openAudit();else if(S.notes.length)openNote();}
function openNote(){var n=S.notes[0];$('auWrap').hidden=false;$('audit').innerHTML='<h3 id="auTitle">'+n.title+'</h3><div class="in">'+n.lines.map(function(l){return '<p>'+l+'</p>'}).join('')+'<div class="acts"><button class="btn primary" data-no="ok">Ясно</button></div></div>';var b=$('audit').querySelector('button');if(b)b.focus();}
function openAudit(){var a=S.audits[0];if(!a)return;$('auWrap').hidden=false;renderAudit(a);var b=$('audit').querySelector('button');if(b)b.focus();}
function renderAudit(a){
  var I=auInfo(a),h='<h3 id="auTitle">'+I.title+'</h3><div class="in"><p>'+I.text+'</p>';
  h+='<div class="sum"><div><span>Штраф</span><span class="neg">'+a.fine+' тис.</span></div><div><span>Готівка</span><span>'+Math.round(S.cash)+' тис.</span></div></div>';
  h+='<div class="sec">Що робиш</div><div class="list">';
  h+='<button class="opt" data-au="pay"><b>Заплатити штраф · '+a.fine+' тис.</b><small>Без фокусів. Підозра +6'+(a.kind==='fop'?', ФОП закривають':'')+'.</small></button>';
  h+='<button class="opt" data-au="law"'+(S.cash<I.lawCost?' disabled':'')+'><b>Юрист · '+I.lawCost+' тис.</b><small>Шанс '+Math.round(I.pLaw*100)+'%: штрафу нема. Інакше платиш штраф і підозра +8.</small></button>';
  h+='<button class="opt" data-au="bribe"'+(S.cash<I.brCost?' disabled':'')+'><b>Домовитись з інспектором · '+I.brCost+' тис.</b><small>Шанс '+Math.round(I.pBr*100)+'%: «акт не склали». Невдача: штраф ×1,5 і підозра +14.</small></button>';
  h+='</div></div>';
  $('audit').innerHTML=h;
}
function resolveAudit(opt){
  var a=S.audits.shift();if(!a)return;
  var I=auInfo(a),fine=a.fine,cost=0,paid=0,closed=false,msg='';
  if(opt==='pay'){paid=fine;S.risk+=6;closed=true;msg='Штраф '+fine+' тис. сплачено.';}
  else if(opt==='law'){
    cost=I.lawCost;
    if(Math.random()<I.pLaw){S.risk+=2;msg='Юрист знайшов процедурну помилку в акті перевірки. Штрафу нема.';}
    else{paid=fine;S.risk+=8;closed=true;msg='Юрист програв: штраф '+fine+' тис. і гонорар '+cost+' тис.';}
  } else {
    cost=I.brCost;
    if(Math.random()<I.pBr){S.risk+=4;msg='Інспектор «загубив» акт. Папка тепер лежить у тебе.';if(a.f)a.f.heat*=.5;}
    else{paid=Math.round(fine*1.5);S.risk+=14;S.contacts=Math.max(0,S.contacts-2);closed=true;msg='Інспектор був із камерою. Штраф '+paid+' тис. і хабар пропав.';}
  }
  if(S.cash<paid+cost)S.risk+=6;
  S.cash=Math.max(0,S.cash-paid-cost);
  S.risk=clamp(S.risk,0,100);
  if(closed&&a.kind==='fop'&&a.f){
    var ix=S.fops.indexOf(a.f);
    if(ix>=0&&S.fops.length>1){S.fops.splice(ix,1);msg+=' «'+a.f.name+'» закрито.';}
    else a.f.heat=0;
  }
  addLog('Податкова: '+msg,closed?'bad':'good');
  $('auWrap').hidden=true;dirtyMini=true;check();ui();maybeAudit();
}
$('audit').addEventListener('click',function(e){if(e.target.closest('[data-no]')){S.notes.shift();$('auWrap').hidden=true;ui();maybeAudit();return;}
  var b=e.target.closest('[data-au]');if(!b||!S.audits.length)return;resolveAudit(b.dataset.au);});

/* ================= КАР'ЄРА ТА ДІЇ ================= */
function rankUp(){
  if(S.over)return;
  if(S.rank===0&&S.cash>=100&&S.contacts>=12){
    S.cash-=30;S.rank=1;S.fops.push({name:'ТОВ «Ви і Ко»',used:0,heat:0,equip:true,isCo:true,lastUsed:0});
    addLog('Зареєстровано ТОВ. Тепер можна брати тендери, а твій район виріс.','good');
  } else if(S.rank===1&&S.cash>=300&&S.contacts>=30&&S.fame>=10){
    S.cash-=120;S.rank=2;S.risk=clamp(S.risk+4,0,100);
    addLog('Ти директор КП. Кошториси пишеш сам, мости теж твої, а покровитель бере свою долю.','good');
  } else return;
  updateRating();genOffers();dirtyMini=true;ui();
}
function nextReq(){
  if(S.rank===0)return {t:'Зареєструвати ТОВ · 30 тис.',need:'Готівка ≥ 100, зв\'язки ≥ 12',ok:S.cash>=100&&S.contacts>=12};
  if(S.rank===1)return {t:'Сісти директором КП · 120 тис.',need:'Готівка ≥ 300, зв\'язки ≥ 30, слава ≥ 10',ok:S.cash>=300&&S.contacts>=30&&S.fame>=10};
  return null;
}
function doBribe(){if(S.over||S.cash<40)return;S.cash-=40;S.risk=clamp(S.risk-12,0,100);addLog('Журналіст раптом зацікавився котиками.','good');ui();}
function doLawyer(){if(S.over||S.cash<90||S.rank<1)return;S.cash-=90;S.risk=clamp(S.risk-25,0,100);addLog('Юрист «усе врегулював». Папки зникли, зате з\'явилась нова.','good');ui();}
function doFlee(){if(!S.over&&S.cash>=FLEE_COST)finish('flee');}

var G, V={ox:0,oy:0,kx:16,ky:8,zs:.5,rs:.5};
function P(X,Y,z){return [V.ox+(X-Y)*V.kx, V.oy+(X+Y)*V.ky-z*V.zs]}

function toHex(r,g,b){return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
function shade(h,k){
  var a=hexn(h);

}
function bl(x0,y0,x1,y1,col,dash){

  var dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,err=dx+dy,n=0,guard=0;
  G.fillStyle=col;

    n++;
    if(x0===x1&&y0===y1)break;
    var e2=2*err;

    if(e2<=dx){err+=dx;y0+=sy;}

}
function poly(pts,fill,ol){
  var p=pts.map(function(r){return [Math.round(r[0]),Math.round(r[1])]}),n=p.length,y0=1e9,y1=-1e9,i,y;
  for(i=0;i<n;i++){if(p[i][1]<y0)y0=p[i][1];if(p[i][1]>y1)y1=p[i][1];}
  if(fill){
    G.fillStyle=fill;

      for(i=0;i<n;i++){

}

function rectY(x0,x1,y,z0,z1,fill){poly([P(x0,y,z0),P(x1,y,z0),P(x1,y,z1),P(x0,y,z1)],fill,false)}

  if(has('fence')){box(.02,2.88,2.98,2.98,0,17,'#b8604a');box(2.88,.02,2.98,2.88,0,17,'#b8604a');}
  if(has('lions')){
    [[1.05,2.4],[1.85,2.4]].forEach(function(l){
      box(l[0]-.1,l[1]-.1,l[0]+.1,l[1]+.1,0,8,'#c5ced2');box(l[0]-.08,l[1]-.08,l[0]+.08,l[1]+.08,8,15,'#e8a82a');ball(l[0],l[1],21,6.5,'#f0bc3c');
    });
  }
  var n=S.castle.length,m=n>=4?1:(n>=2?0:-1);
  fig(.55,2.5,'#3b6fd0',m);fig(.75,2.62,'#d85a82',m);
}

/* ================= ЧАС ТА ЦИКЛ ================= */
function modalOpen(){return !$('auWrap').hidden||!$('dealWrap').hidden||!$('elWrap').hidden||!$('end').hidden}
function tickTime(dt){
  if(!S||S.over||S.speed<=0||modalOpen())return;
  S.tick+=dt*S.speed;
  if(S.tick>=MONTH_MS)nextMonth();
  var l=monthLabel();
  if(l!==lastLabel){lastLabel=l;$('monthL').textContent=l;}
}
function tileAtPx(ix,iy){
  var z=S.zoom,wx=(ix-mc.width/2)/z+S.cam.x,wy=(iy-mc.height/2)/z+S.cam.y,a=wx/16,b=wy/8;
  var X=Math.floor((a+b)/2),Y=Math.floor((b-a)/2);
  return (X>=0&&Y>=0&&X<N&&Y<N)?{x:X,y:Y}:null;
}
function pxOf(e){var r=mc.getBoundingClientRect();return {x:(e.clientX-r.left)*(mc.width/r.width),y:(e.clientY-r.top)*(mc.height/r.height)};}
function tap(e){
  if(S.over)return;
  var p=pxOf(e),i;
  for(i=hits.length-1;i>=0;i--){var h=hits[i];if(p.x>=h.x0&&p.x<=h.x1&&p.y>=h.y0&&p.y<=h.y1){openDeal(h.off);return;}}
  var t=tileAtPx(p.x,p.y);if(!t)return;
  var off=offerAt(t.x,t.y);
  if(off){openDeal(off);return;}
  var o=S.objs[t.y*N+t.x];
  if(!inZone(t.x,t.y))addLog('Це не твій район. Підвищення в ранзі відкриє більше кварталів.','');
  else if(o&&'RYHSPB'.indexOf(o.t)>=0)addLog('«'+o.name+'» ('+(ZNAME[o.zn]||'місто')+'): стан '+Math.round(o.c)+'%. '+(o.c>=58?'Поки без заявок.':'Заявки для твого рангу тут нема.'),'');
  else return;
  ui();
}
var ptrs={},tapInfo=null,pinch0=0;
mc.addEventListener('pointerdown',function(e){
  try{mc.setPointerCapture(e.pointerId);}catch(_){}
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  var n=Object.keys(ptrs).length;
  tapInfo=(n===1)?{x:e.clientX,y:e.clientY,t:performance.now(),moved:false}:null;
  if(n===2){var k=Object.keys(ptrs);pinch0=Math.hypot(ptrs[k[0]].x-ptrs[k[1]].x,ptrs[k[0]].y-ptrs[k[1]].y);}
});
mc.addEventListener('pointermove',function(e){
  var p=ptrs[e.pointerId],r=mc.getBoundingClientRect();
  if(!p){var q=pxOf(e);hover=tileAtPx(q.x,q.y);return;}
  var k=Object.keys(ptrs);
  if(k.length===1){
    var dx=e.clientX-p.x,dy=e.clientY-p.y;
    if(tapInfo&&Math.hypot(e.clientX-tapInfo.x,e.clientY-tapInfo.y)>8)tapInfo.moved=true;
    if(!tapInfo||tapInfo.moved){
      var f=(mc.width/r.width)/S.zoom;S.cam.x-=dx*f;S.cam.y-=dy*f;clampCam();
    }
    p.x=e.clientX;p.y=e.clientY;
  } else if(k.length===2){
    ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
    var d=Math.hypot(ptrs[k[0]].x-ptrs[k[1]].x,ptrs[k[0]].y-ptrs[k[1]].y);
    if(pinch0&&d/pinch0>1.5){setZoom(1);pinch0=d;}
    else if(pinch0&&d/pinch0<.67){setZoom(-1);pinch0=d;}
  }
});
function endPtr(e){
  var had=ptrs[e.pointerId];delete ptrs[e.pointerId];
  if(had&&tapInfo&&!tapInfo.moved&&performance.now()-tapInfo.t<600&&Object.keys(ptrs).length===0)tap(e);
  if(Object.keys(ptrs).length===0){tapInfo=null;pinch0=0;ui();}
}
mc.addEventListener('pointerup',endPtr);
mc.addEventListener('pointercancel',function(e){delete ptrs[e.pointerId];tapInfo=null;});
mc.addEventListener('pointerleave',function(){hover=null;});
mc.addEventListener('wheel',function(e){e.preventDefault();setZoom(e.deltaY<0?1:-1);},{passive:false});
mini.addEventListener('pointerdown',function(e){
  var r=mini.getBoundingClientRect();centerOn((e.clientX-r.left)/r.width*N,(e.clientY-r.top)/r.height*N);
});
window.addEventListener('resize',resizeMap);

var lastT=0;
function frame(now){
  var dt=lastT?Math.min(80,now-lastT):0;lastT=now;
  if(!reduce)cars.forEach(function(c){c.pos+=c.dir*c.spd*dt;if(c.dir>0&&c.pos>c.b)c.pos=c.a;if(c.dir<0&&c.pos<c.a)c.pos=c.b;});
  tickTime(dt);
  resizeMap();
  drawMap(now);drawMini();
  if(!$('pane-castle').hidden)drawCastle(now);
  requestAnimationFrame(frame);
}
if(typeof window.__EXPOSE==='function')window.__EXPOSE({get S(){return S},get D(){return D},get E(){return E},newGame:newGame,nextMonth:nextMonth,tickTime:tickTime,openDeal:openDeal,tryDeal:tryDeal,signDeal:signDeal,renderDeal:renderDeal,rankUp:rankUp,openElection:openElection,runElection:runElection,openAnnual:openAnnual,annualTick:annualTick,resolveAudit:resolveAudit,maybeAudit:maybeAudit,genOffers:genOffers,ui:ui,drawMap:drawMap,drawMini:drawMini,drawCastle:drawCastle,chance:chance,setD:function(k,v){D[k]=v;},updateRating:updateRating,tap:tap,setZoom:setZoom,centerOn:centerOn});
newGame();
resizeMap();
requestAnimationFrame(frame);
})();
</script>
