<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Симулятор корупціонера (мультяшна)</title></head><body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&family=Rubik+Mono+One&display=swap">
<style>
/* Layout: ізометричний район Києва зліва, кар'єра/замок/новини справа; на телефоні одна колонка. Мультяшні наліпки з товстим контуром. */
:root{
  --bg:#bfe4f0;
  --card:#ffffff;
  --ink:#1f2340;
  --muted:#5b6182;
  --money:#1f9d5c;
  --warn:#f0483e;
  --gold:#ffbf2e;
  --blue:#3b82f6;
  --soft:#f3f6fb;
  --head:'Rubik Mono One','Rubik',system-ui,sans-serif;
  --body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;
  padding-block:18px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:1040px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-family:var(--head);font-weight:400;font-size:clamp(18px,4.6vw,28px);line-height:1.15;margin:0;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-weight:900;background:var(--gold);border:3px solid var(--ink);border-radius:999px;padding:3px 12px;box-shadow:0 3px 0 var(--ink);font-variant-numeric:tabular-nums;font-size:14px}
.chip.rank{background:#fff}
h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;margin:0 0 8px;color:var(--muted);font-weight:700}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:920px){.grid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}}
.col{display:grid;gap:14px;min-width:0}
.card{background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:12px 14px;min-width:0}
.cv{padding:6px;background:#dff3fa}
canvas{display:block;width:100%;height:auto;max-width:100%;touch-action:manipulation}
#city{cursor:pointer}
.meters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:560px){.meters{grid-template-columns:repeat(4,minmax(0,1fr))}}
.m{background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:8px 10px;box-shadow:0 4px 0 var(--ink);min-width:0}
.m b{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.m span{display:block;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.m.money span{color:var(--money)}
.bar{height:10px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:#e9edf5;margin-top:4px}
.bar i{display:block;height:100%;transition:width .35s}
button{font:inherit;color:var(--ink);cursor:pointer}
button:focus-visible,canvas:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.list{display:grid;gap:8px}
.offer,.opt,.up,.fopb{background:var(--soft);border:3px solid var(--ink);border-radius:12px;padding:8px 10px;min-height:48px;text-align:left;line-height:1.25;width:100%}
.offer{display:flex;justify-content:space-between;gap:10px;align-items:center}
.offer b,.opt b,.up b{font-weight:700}
.offer small,.opt small,.up small{display:block;color:var(--muted);font-size:12px}
.offer .amt{font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--money)}
.tag{display:inline-block;font-size:11px;font-weight:700;border:2px solid var(--ink);border-radius:999px;padding:0 7px;margin-right:6px;background:#fff;vertical-align:1px}
.tag.t-direct{background:#d8f5e3}.tag.t-tender{background:#ffe9b3}.tag.t-auction{background:#e3d8ff}
.opt[aria-pressed="true"]{background:var(--gold);box-shadow:0 3px 0 var(--ink);transform:translateY(-2px)}
.opt[aria-pressed="true"] small{color:var(--ink)}
.opt:disabled,.up:disabled,.offer:disabled{opacity:.45;cursor:not-allowed}
.up{display:flex;justify-content:space-between;gap:10px;align-items:center}
.up.own{background:#d8f5e3}
.note{margin:6px 0 0;color:var(--muted);font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:3px solid var(--ink);border-radius:14px;padding:10px 16px;font-weight:700;background:#fff;box-shadow:0 4px 0 var(--ink);min-height:48px}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--money);color:#fff;flex:1 1 180px}
.btn.gold{background:var(--gold)}
.btn.small{min-height:40px;padding:6px 12px;font-size:13px;box-shadow:0 3px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--gold);transform:translateY(-2px)}
.speed{display:flex;gap:8px;flex:1 1 100%}.speed .btn{flex:1;padding-inline:8px}
#tickbar{transition:none}
.fop{border:3px solid var(--ink);border-radius:12px;padding:8px 10px;background:var(--soft);display:grid;gap:4px}
.fop .row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.heat{font-size:12px;font-weight:700}
.heat.hot{color:var(--warn)}
#mood{margin:8px 0 0;font-size:14px}
#log{list-style:none;margin:0;padding:0;display:grid;gap:6px}
#log li{padding:7px 10px;border-radius:10px;background:var(--soft);border:2px solid transparent;font-size:14px}
#log li.bad{background:#ffe6e3;border-color:#f6b2ab}
#log li.good{background:#dcf5e5;border-color:#a7dfbb}
.overlay{position:fixed;inset:0;background:rgba(31,35,64,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;overflow:auto}
.overlay[hidden]{display:none}
.modal{background:#fff;border:4px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);max-width:520px;width:100%;padding:18px;max-height:calc(100% - 8px);overflow:auto}
.modal h3{font-family:var(--head);font-weight:400;font-size:19px;margin:0 0 6px;text-wrap:balance}
.modal p{margin:0 0 10px}
.modal .sub{color:var(--muted);font-size:13px}
.sec{margin:12px 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sum{background:var(--soft);border:2px dashed var(--ink);border-radius:12px;padding:8px 10px;font-variant-numeric:tabular-nums;font-size:14px}
.sum div{display:flex;justify-content:space-between;gap:10px}
.sum .tot{font-weight:900;border-top:2px solid var(--ink);margin-top:4px;padding-top:4px}
.pos{color:var(--money)}.neg{color:var(--warn)}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<main class="wrap">
  <header class="top">
    <h1>Симулятор корупціонера</h1>
    <div class="chips"><div class="chip rank" id="rank">ФОП-початківець</div><div class="chip" id="month">Місяць 1</div></div>
  </header>

  <div class="grid">
    <section class="col" aria-label="Район">
      <div class="card cv"><canvas id="city" width="800" height="440" aria-label="Ізометрична карта району Києва. Клікни по об'єкту зі знаком оклику, щоб взяти замовлення."></canvas><div class="bar" style="margin:6px 6px 2px" aria-hidden="true"><i id="tickbar" style="width:0;background:#3b82f6"></i></div></div>
      <div class="meters" id="meters"></div>
      <div class="card">
        <h2>Заявки району</h2>
        <div class="list" id="offers"></div>
        <p class="note" id="offerNote"></p>
      </div>
      <div class="card">
        <h2>Мої ФОПи та фірми</h2>
        <div class="list" id="fops"></div>
      </div>
    </section>

    <section class="col" aria-label="Кар'єра, замок і новини">
      <div class="card">
        <h2>Кар'єра</h2>
        <div id="career"></div>
      </div>
      <div class="actions">
        <div class="speed" id="speed" role="group" aria-label="Швидкість часу"></div>
        <button class="btn" id="bribe"></button>
        <button class="btn" id="lawyer"></button>
        <button class="btn" id="flee"></button>
      </div>
      <div class="card">
        <h2>Пшонок-замок</h2>
        <canvas id="castle" width="400" height="290" aria-label="Будинок родини, який дорослішає за заробіток"></canvas>
        <p id="mood"></p>
        <div class="list" id="upgrades" style="margin-top:8px"></div>
      </div>
      <div class="card">
        <h2>Новини району</h2>
        <ul id="log"></ul>
      </div>
    </section>
  </div>
</main>

<div class="overlay" id="dealWrap" hidden role="dialog" aria-modal="true" aria-labelledby="dealTitle"><div class="modal" id="deal"></div></div>
<div class="overlay" id="elWrap" hidden role="dialog" aria-modal="true" aria-labelledby="elTitle"><div class="modal" id="elect"></div></div>
<div class="overlay" id="end" hidden role="dialog" aria-modal="true" aria-labelledby="endTitle">
  <div class="modal">
    <h3 id="endTitle"></h3>
    <p id="endText"></p>
    <p id="endScore" style="font-weight:700"></p>
    <button class="btn primary" id="again" style="width:100%">Ще раз</button>
  </div>
</div>

<script>
(function(){
'use strict';
var INK='#1f2340', N=8;
var $=function(id){return document.getElementById(id)};
var cv=$('city'), cx=cv.getContext('2d');
var cc=$('castle'), cx2=cc.getContext('2d');
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Район: H панелька, Y двір, R дорога, S школа, P сквер (каштани), K місце під МАФ, L пустир */
var MAP=['HHRYPRHH','HYRYPRYH','SYRKKRYL','RRRRRRRR','HYRYYRHH','HHRYKRLL','YYRPPRHY','HSRPPRHH'];
var STREETS=['вул. Каштанова','вул. Подільська','бульв. Дружби','вул. Липська','просп. Лісовий','вул. Сирецька','пров. Ярославів','вул. Борщагівська'];
var BASE={R:60,Y:70,H:170,S:240,P:130};
var RANKS=['ФОП-початківець','Підрядник','Директор КП','Депутат Київради'];
var MONTHS=['Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень','Січень','Лютий'];
var TIERS=[
  {n:'Чесно',cost:.78,q:.95,fame:2,d:'Як у кошторисі. Прибуток тонкий, зате ремонт живе довго.'},
  {n:'Економно',cost:.55,q:.6,fame:1,d:'Тонший шар, дешевша суміш. Років на два.'},
  {n:'Халтура',cost:.3,q:.25,fame:0,d:'Присипали і втрамбували. До першого дощу.'}
];
var BRIBES=[0,.1,.2];
var FOP_LIMIT=150;
var FOP_NAMES=['ФОП Тітка Валя','ФОП Кум Степан','ФОП Сусід Борис','ФОП Теща','ФОП Шурін Едік'];
var UPG=[
  {k:'fence',n:'Триметровий паркан',c:300},
  {k:'pool',n:'Басейн з підігрівом',c:600},
  {k:'lions',n:'Леви біля ґанку',c:400},
  {k:'toilet',n:'Золотий унітаз',c:500},
  {k:'heli',n:'Вертолітний майданчик',c:1200}
];
var MOOD=[
  'Родина ще в двокімнатній. Дружина вже склала список.',
  'Фундамент є. Сусіди питають, що це будується.',
  'Діти питають, звідки гроші. Їм кажуть: «Бабуся».',
  'Це вже не дім, це заява про наміри.',
  'З вертольотного майданчика добре видно, як хтось знімає це на телефон.',
  'Усе готово. Тільки золотий унітаз трохи холодний.'
];
var EL={
  agit:{n:'Агітація і банери',c:50,pts:8,rk:0,d:'Чесно, нудно, дорого.'},
  buck:{n:'Гречка по двох будинках',c:80,pts:14,rk:10,d:'Прямий підкуп виборців. Працює, а потім згадують.'},
  tech:{n:'Технічний кандидат',c:60,pts:0,rival:8,rk:5,d:'Однофамілець головного суперника, щоб голоси розійшлись.'},
  admin:{n:'Адмінресурс',c:0,pts:10,rk:6,d:'Працівники КП «добровільно» прийшли на мітинг.'}
};
var FLEE_COST=1000;

var S, D=null, E=null, V={ox:400,oy:84,kx:32,ky:16,tilt:0}, g=cx, hover=null, floaters=[], cars=[];

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function r5(v){return Math.round(v/5)*5}
function rnd(a,b){return a+Math.random()*(b-a)}
function hashXY(x,y){return ((x*73856093)^(y*19349663))>>>0}
function fmt(v){return Math.round(v)+' тис.'}

function mult(){return S.rank>=3?2.5:(S.rank>=2?1.4:1)}
function rating(){
  var s=0,n=0;
  S.objs.forEach(function(o){
    if(!o)return;
    if('RYHSP'.indexOf(o.t)>=0){s+=o.c;n++;}else if(o.t==='N'){s+=100;n++;}
  });
  return clamp(Math.round((n?s/n:50)-S.angry),0,100);
}

/* ---------- state ---------- */
function newGame(){
  S={speed:0,tick:0,month:1,cash:70,risk:6,contacts:8,fame:0,rank:0,angry:0,inflate:0,objs:[],offers:[],pending:[],castle:[],log:[],over:false,
     fops:[{name:'ФОП Ви',used:0,heat:0,equip:false,isCo:false,lastUsed:0}]};
  var HP=['#e6c9a3','#b9cadb','#dbbacb','#c8dbb9','#f1da8e'];
  for(var y=0;y<N;y++)for(var x=0;x<N;x++){
    var t=MAP[y].charAt(x),i=y*N+x,c=50;
    if(t==='R')c=rnd(15,50);else if(t==='Y')c=rnd(20,60);else if(t==='H')c=rnd(25,70);else if(t==='S')c=rnd(25,65);else if(t==='P')c=rnd(30,70);
    S.objs[i]={t:t,c:c,q:.5,by:null,owned:false,x:x,y:y,col:HP[hashXY(x,y)%HP.length],
      name:t==='R'?STREETS[(x*3+y)%STREETS.length]:(t==='H'?'буд. '+(10+x*4+y):(t==='S'?'школа №'+(100+x+y):(t==='P'?'сквер Каштановий':(t==='Y'?'двір, буд. '+(10+x*4+y):'місце'))))};
  }
  cars=[
    {ax:'x',lane:3.3,pos:-.5,dir:1,spd:.00075,col:'#ef5350'},
    {ax:'x',lane:3.7,pos:8.5,dir:-1,spd:.0006,col:'#42a5f5'},
    {ax:'y',lane:2.3,pos:-.5,dir:1,spd:.0005,col:'#ffca28'},
    {ax:'y',lane:5.7,pos:8.5,dir:-1,spd:.00065,col:'#66bb6a'}
  ];
  addLog('Ти ФОП з лопатою і знайомим у ЖЕКу. Клікни на об\'єкт зі знаком оклику або обери заявку. Час стоїть: натисни 1×, і місяць піде сам.');
  $('end').hidden=true;$('dealWrap').hidden=true;$('elWrap').hidden=true;
  genOffers();ui();
}
function addLog(t,k){S.log.unshift({t:t,k:k||''});S.log=S.log.slice(0,7)}

/* ---------- offers ---------- */
function genOffers(){
  var list=[],m=mult();
  S.objs.forEach(function(o,i){
    if(!o)return;
    var t=o.t,x=i%N,y=(i/N)|0,off=null;
    if(t==='K'){
      if(S.rank>=2&&!o.owned)off={x:x,y:y,t:'K',budget:60,price:20,kind:'auction',comp:rnd(.05,.2),title:'Аукціон на МАФ'};
    } else if(t==='L'){
      if(S.rank>=3)off={x:x,y:y,t:'L',budget:r5(1800),kind:'tender',comp:rnd(.08,.22),title:'Забудова пустиря (ЖК)'};
    } else if(t!=='N'&&o.c<58){
      var b=r5(BASE[t]*(.55+(100-o.c)/100)*m);
      if(S.rank===0){if(t!=='R'&&t!=='Y')return;b=Math.min(95,b);}
      var title={R:'Ямковий ремонт',Y:'Плитка у дворі',H:'Утеплення фасаду',S:'Ремонт школи',P:'Благоустрій скверу'}[t];
      off={x:x,y:y,t:t,budget:b,kind:b<100?'direct':'tender',comp:b<100?0:rnd(.04,.22),title:title};
    }
    if(off){off.name=o.name;off.c=o.c;list.push(off);}
  });
  list.sort(function(a,b){var pa=(a.t==='K'||a.t==='L')?-1:0,pb=(b.t==='K'||b.t==='L')?-1:0;return pa-pb||a.c-b.c;});
  S.offers=list.slice(0,7);
}
function offerAt(x,y){for(var i=0;i<S.offers.length;i++)if(S.offers[i].x===x&&S.offers[i].y===y)return S.offers[i];return null}
var KIND={direct:'прямий договір',tender:'тендер',auction:'аукціон'};
var GATE={direct:'Начальник ЖЕКу',tender:'Тендерний комітет КП',auction:'Комісія з МАФів'};

/* ---------- deal ---------- */
function chance(){
  var o=D.off,p;
  if(o.kind==='direct')p=.22+S.contacts*.004+D.bribe*1.6;
  else if(o.kind==='tender')p=.18+S.contacts*.003+D.bribe*1.3+(D.tailor?.22:0)-o.comp;
  else p=.2+S.contacts*.004+D.bribe*1.4-o.comp;
  return clamp(p,.05,.95);
}
function payAmt(){return Math.round(D.off.budget*(D.infl?1.25:1))}
function fopOk(f){
  var o=D.off;
  if(o.kind==='tender'&&!f.isCo)return false;
  return f.isCo||f.used+payAmt()<=FOP_LIMIT;
}
function openDeal(off){
  if(S.over)return;
  var fi=0;
  D={off:off,step:1,bribe:0,tailor:false,fop:0,tier:1,infl:false};
  $('dealWrap').hidden=false;
  renderDeal();
  var b=$('deal').querySelector('button');if(b)b.focus();
}
function closeDeal(){D=null;$('dealWrap').hidden=true;}
function renderDeal(){
  var o=D.off,h='';
  h+='<h3 id="dealTitle">'+o.title+'</h3>';
  h+='<p class="sub"><span class="tag t-'+o.kind+'">'+KIND[o.kind]+'</span>'+o.name+'</p>';
  if(D.step===1){
    h+='<p>Хто вирішує: <b>'+GATE[o.kind]+'</b>. '+(o.kind==='auction'?'Місце під кіоск: ринкова вартість '+o.budget+' тис., на аукціоні віддають за '+o.price+' тис. Рента '+7+' тис. щомісяця.':'Бюджет: <b>'+o.budget+' тис. ₴</b>. '+(o.kind==='direct'?'До 100 тис. тендера нема, договір віддають «своєму».':'Є ще конкуренти, їхня сила впливає на шанс.'))+'</p>';
    h+='<div class="sec">Як заходиш</div><div class="list">';
    BRIBES.forEach(function(b,i){
      var save=D.bribe;D.bribe=b;var p=Math.round(chance()*100);D.bribe=save;
      h+='<button class="opt" data-a="bribe" data-v="'+i+'" aria-pressed="'+(D.bribe===b)+'"><b>'+(b===0?'Подати як є':'Домовитись · '+Math.round(b*100)+'%')+'</b><small>Шанс '+p+'%'+(b>0?' · відкат '+Math.round(o.budget*b)+' тис. (платиш, якщо виграєш)':' · без відкату')+'</small></button>';
    });
    h+='</div>';
    if(o.kind==='tender'){
      h+='<div class="list" style="margin-top:8px"><button class="opt" data-a="tailor" aria-pressed="'+D.tailor+'"><b>Умови під себе</b><small>+22% шанс · 5% бюджету · підозра +2</small></button></div>';
    }
    h+='<div class="actions" style="margin-top:14px"><button class="btn primary" data-a="try">Спробувати · шанс '+Math.round(chance()*100)+'%</button><button class="btn" data-a="cancel">Назад</button></div>';
  } else {
    var pay=payAmt(),bribeAmt=Math.round(o.budget*D.bribe),tailorAmt=D.tailor?Math.round(o.budget*.05):0;
    if(o.kind==='auction'){
      var up=o.price+bribeAmt+tailorAmt;
      h+='<p><b>Місце за тобою.</b> Віддаєш '+o.price+' тис. за місце'+(bribeAmt?' і '+bribeAmt+' тис. відкату':'')+'.</p>';
      h+='<div class="sum"><div><span>Витрати зараз</span><span class="neg">−'+up+' тис.</span></div><div class="tot"><span>Рента щомісяця</span><span class="pos">+7 тис.</span></div></div>';
      h+='<div class="actions" style="margin-top:14px"><button class="btn primary" data-a="sign"'+(S.cash<up?' disabled':'')+'>Оформити</button><button class="btn" data-a="cancel">Відмовитись</button></div>';
      if(S.cash<up)h+='<p class="note">Не вистачає готівки: треба '+up+' тис.</p>';
    } else {
      var t=TIERS[D.tier],costNow=Math.round(o.budget*t.cost),up2=costNow+bribeAmt+tailorAmt,prof=pay-up2,avans=Math.round(pay*.25);
      var okFops=S.fops.filter(fopOk);
      if(okFops.length&&!fopOk(S.fops[D.fop]))D.fop=S.fops.indexOf(okFops[0]);
      h+='<p><b>Договір твій.</b> Обери, на кого оформити і як робити.</p>';
      h+='<div class="sec">На кого оформити</div><div class="list">';
      S.fops.forEach(function(f,i){
        var ok=fopOk(f);
        h+='<button class="opt" data-a="fop" data-v="'+i+'" aria-pressed="'+(D.fop===i)+'"'+(ok?'':' disabled')+'><b>'+f.name+'</b><small>'+(f.isCo?'без ліміту, потрібна для тендерів':'вільний ліміт '+Math.max(0,FOP_LIMIT-f.used)+' тис. цього місяця'+(o.kind==='tender'?' · на тендер не годиться':''))+'</small></button>';
      });
      h+='</div>';
      if(!okFops.length)h+='<p class="note">Нема на кого оформити: ліміт ФОПів вичерпано. Купи ще один ФОП або візьми менший договір.</p>';
      h+='<div class="sec">Як виконуєш</div><div class="list">';
      TIERS.forEach(function(tt,i){
        h+='<button class="opt" data-a="tier" data-v="'+i+'" aria-pressed="'+(D.tier===i)+'"><b>'+tt.n+'</b><small>Витрати '+Math.round(tt.cost*100)+'% бюджету · '+tt.d+'</small></button>';
      });
      h+='</div>';
      if(S.rank>=2)h+='<div class="list" style="margin-top:8px"><button class="opt" data-a="infl" aria-pressed="'+D.infl+'"><b>Завищений акт</b><small>+25% до оплати · підозра +3 · тебе можуть перевірити</small></button></div>';
      h+='<div class="sec">Підсумок</div><div class="sum">'+
        '<div><span>Аванс при підписанні</span><span class="pos">+'+avans+'</span></div>'+'<div><span>Решта ('+(o.kind==='direct'?'через 1 міс.':'через 2 міс.')+')</span><span class="pos">+'+(pay-avans)+'</span></div>'+
        '<div><span>Роботи зараз</span><span class="neg">−'+costNow+'</span></div>'+
        (bribeAmt?'<div><span>Відкат</span><span class="neg">−'+bribeAmt+'</span></div>':'')+
        (tailorAmt?'<div><span>Умови під себе</span><span class="neg">−'+tailorAmt+'</span></div>':'')+
        '<div class="tot"><span>Прибуток</span><span class="'+(prof>=0?'pos':'neg')+'">'+(prof>=0?'+':'')+prof+' тис.</span></div></div>';
      var short=S.cash<up2-avans;
      h+='<div class="actions" style="margin-top:14px"><button class="btn primary" data-a="sign"'+((short||!okFops.length)?' disabled':'')+'>Підписати акт</button><button class="btn" data-a="cancel">Відмовитись</button></div>';
      if(short)h+='<p class="note">Не вистачає готівки: на старті треба '+(up2-avans)+' тис. (витрати мінус аванс). Спробуй дешевший варіант виконання.</p>';
    }
  }
  $('deal').innerHTML=h;
}
var LOSE=['Договір дістався племіннику начальника.','Хтось запропонував більше, ніж ти.','«Ми вас почули. Ми вам передзвонимо».','Тендер скасували, і через тиждень оголосили такий самий.'];
function tryDeal(){
  if(Math.random()<chance()){
    D.step=2;addLog('Домовились: «'+D.off.title+'», '+D.off.name+'.','good');renderDeal();
  } else {
    addLog(LOSE[(Math.random()*LOSE.length)|0],'bad');closeDeal();ui();
  }
}
function signDeal(){
  var o=D.off,obj=S.objs[o.y*N+o.x],bribeAmt=Math.round(o.budget*D.bribe),tailorAmt=D.tailor?Math.round(o.budget*.05):0;
  var pt=pxAt(o.x+.5,o.y+.5,30);
  if(o.kind==='auction'){
    var up=o.price+bribeAmt+tailorAmt;if(S.cash<up)return;
    S.cash-=up;obj.owned=true;S.fame+=1;
    S.risk=clamp(S.risk+1+(D.bribe*10)+(D.tailor?2:0),0,100);
    if(D.bribe>0)S.contacts+=3;
    floaters.push({x:pt[0],y:pt[1],txt:'Кіоск твій',col:'#7c4dff',t0:performance.now()});
    addLog('МАФ оформлено. Тепер щомісяця +7 тис., поки не прийдуть із перевіркою.','good');
  } else {
    var t=TIERS[D.tier],f=S.fops[D.fop],pay=payAmt(),costNow=Math.round(o.budget*t.cost),up2=costNow+bribeAmt+tailorAmt;
    var avans=Math.round(pay*.25);
    if(S.cash<up2-avans||!fopOk(f))return;
    S.cash-=up2;S.cash+=avans;f.used+=pay;
    S.pending.push({due:S.month+(o.kind==='direct'?1:2),amt:pay-avans});
    obj.c=70+30*t.q;obj.q=t.q;obj.by='me';
    S.fame+=t.fame+(o.budget>=200?1:0);
    S.risk=clamp(S.risk+1+(D.bribe*10)+(D.tailor?2:0)+(D.infl?3:0)+(t.q<.4?1:0),0,100);
    if(D.bribe>0)S.contacts+=3;
    if(D.infl)S.inflate+=1;
    if(obj.t==='L'){obj.t='N';obj.c=100;S.angry+=4;addLog('Виріс новий ЖК на місці пустиря. Мешканці сусідніх будинків питають про сонце у вікнах.','bad');}
    floaters.push({x:pt[0],y:pt[1],txt:'+'+(pay-up2)+' тис.',col:'#1f9d5c',t0:performance.now()});
    addLog(o.title+': '+t.n.toLowerCase()+'. Прибуток '+(pay-up2)+' тис.: аванс '+avans+' уже в кишені, решта через '+(o.kind==='direct'?1:2)+' міс.','');
  }
  closeDeal();genOffers();check();ui();
}

/* ---------- month ---------- */
function nextMonth(){
  if(S.over)return;
  S.tick=0;
  S.month++;
  var inc=0,i,f;
  S.pending=S.pending.filter(function(p){if(p.due<=S.month){inc+=p.amt;return false;}return true;});
  S.objs.forEach(function(o){if(o&&o.t==='K'&&o.owned)inc+=7;});
  S.cash+=inc;
  var trib=0;
  if(S.rank>=2&&inc>0){trib=Math.round(inc*(S.rank>=3?.15:.1));S.cash-=trib;}
  addLog(MONTHS[(S.month-1)%12]+': надійшло '+Math.round(inc)+' тис.'+(trib?', покровителю «долю» '+trib+' тис.':'.'),'');
  var idx=(S.month-1)%12,k=idx>=8?1.6:1;
  S.objs.forEach(function(o){
    if(!o||'RYHSP'.indexOf(o.t)<0)return;
    o.c=clamp(o.c-(.6+(1.5-o.q)*2.4)*k,0,100);
  });
  if(idx===8&&S.objs.some(function(o){return o&&o.by==='me'&&o.q<.4;}))addLog('Почалась зима. Те, що ти клав у жовтні, дякує за підробіток.','bad');
  /* ФОПи: увага податкової */
  S.fops.forEach(function(f){
    f.lastUsed=f.used;
    if(!f.isCo)f.heat=f.heat*.7+(f.used/FOP_LIMIT)*(f.equip?.35:1);
    f.used=0;
  });
  for(i=S.fops.length-1;i>=0;i--){
    f=S.fops[i];if(f.isCo)continue;
    if(Math.random()<Math.min(.45,f.heat*.11)){
      var pen=Math.max(15,Math.round(f.lastUsed*.2));
      S.cash=Math.max(0,S.cash-pen);S.risk=clamp(S.risk+9,0,100);S.contacts=Math.max(0,S.contacts-2);
      if(i===0&&S.fops.length===1){f.heat=0;addLog('Податкова: ФОП без техніки і працівників виграє договори. Штраф '+pen+' тис.','bad');}
      else{S.fops.splice(i,1);addLog('Податкова закрила «'+f.name+'»: ні техніки, ні людей, ні пояснень. Штраф '+pen+' тис.','bad');}
    }
  }
  /* скандали */
  var bad=S.objs.filter(function(o){return o&&o.by==='me'&&o.q<.4&&o.c<48;}).length;
  if(bad&&Math.random()<Math.min(.55,bad*.14)){S.risk=clamp(S.risk+9,0,100);addLog('Журналіст зняв відео про твій «ремонт»: яма вже там, де був асфальт.','bad');}
  var weak=S.objs.filter(function(o){return o&&o.by==='me'&&o.q<.35&&o.c<30&&'RYHSP'.indexOf(o.t)>=0;});
  if(weak.length&&Math.random()<.25){
    var w=weak[(Math.random()*weak.length)|0];w.c=8;S.risk=clamp(S.risk+7,0,100);S.angry+=2;
    addLog('Провалилось: '+w.name+'. Пісок замість бетону не витримав.','bad');
  }
  if(S.inflate>0){
    if(Math.random()<Math.min(.5,S.inflate*.12)){S.risk=clamp(S.risk+14,0,100);S.inflate*=.7;addLog('Держаудит перевірив акти: обсяги не збігаються з реальністю.','bad');}
    else S.inflate*=.85;
  }
  var rt=rating();
  if(rt<35&&Math.random()<.3){S.risk=clamp(S.risk+5,0,100);S.contacts=Math.max(0,S.contacts-2);addLog('Мешканці вийшли під райадміністрацію. На плакатах твоє прізвище майже не видно.','bad');}
  S.angry*=.93;
  S.risk=clamp(S.risk-2.5-(rt>60?1:0)+S.castle.length*1.2,0,100);
  /* вибори */
  genOffers();
  var elect=((S.month-1)%12===0&&S.month>1);
  check();
  ui();
  if(elect&&!S.over){
    if(S.rank>=2)openElection();
    else addLog('Вибори до Київради пройшли без тебе. Ти ще не в грі.','');
    ui();
  }
}
function check(){
  if(S.over)return;
  if(S.risk>=100)return finish('caught');
  if(S.month>8&&rating()<6)return finish('riot');
  if(S.castle.length===UPG.length)return finish('win');
}
function finish(k){
  S.over=true;closeDeal();$('elWrap').hidden=true;
  var T={
    caught:['За вами приїхали','Журналісти, перевірки й чиїсь діти з телефонами зробили свою справу. Ухвалу почали читати з золотого унітаза.'],
    riot:['Район повстав','Настрій упав майже до нуля. Люди вийшли на вулиці, які ти так і не полатав.'],
    win:['Пшонок-замок збудовано','Паркан, леви, басейн, золотий унітаз і вертоліт. Район у ямах, родина щаслива. Сумнівно, що надовго.'],
    flee:['Валіза зібрана','Ти в аеропорту з готівкою. Район лишився з ямами, а замок так і не добудований.']
  }[k];
  $('endTitle').textContent=T[0];$('endText').textContent=T[1];
  $('endScore').textContent='Місяців: '+S.month+' · Ранг: '+RANKS[S.rank]+' · Готівка: '+Math.round(S.cash)+' тис. · Замок: '+S.castle.length+'/'+UPG.length;
  $('end').hidden=false;$('again').focus();ui();
}

/* ---------- elections ---------- */
function baseSupport(){return rating()*.3+Math.min(S.fame,40)*.6+S.contacts*.15}
function electStats(){
  var pts=0,rv=0,cost=0,rk=0;
  Object.keys(EL).forEach(function(k){if(E.pick[k]){var e=EL[k];pts+=e.pts;rv+=(e.rival||0);cost+=e.c;rk+=e.rk;}});
  var wins=0,b=baseSupport();
  for(var i=0;i<400;i++){if(b+pts+rnd(0,12)>40+(S.rank===3?6:0)+rnd(0,25)-rv)wins++;}
  return {pts:pts,rv:rv,cost:cost,rk:rk,p:Math.round(wins/4)};
}
function openElection(){
  E={pick:{agit:false,buck:false,tech:false,admin:false}};
  $('elWrap').hidden=false;renderElection();
}
function renderElection(){
  var st=electStats(),h='<h3 id="elTitle">Вибори до Київради</h3>';
  h+='<p class="sub">'+(S.rank===3?'Переобрання. Втратиш місце, якщо програєш.':'Мажоритарний округ. Хто купив більше голосів і побачив більше афіш, той і виграв.')+'</p>';
  h+='<div class="sec">Кампанія</div><div class="list">';
  Object.keys(EL).forEach(function(k){
    var e=EL[k];
    h+='<button class="opt" data-e="'+k+'" aria-pressed="'+E.pick[k]+'"><b>'+e.n+(e.c?' · '+e.c+' тис.':' · безкоштовно')+'</b><small>'+e.d+(e.rk?' Підозра +'+e.rk+'.':'')+'</small></button>';
  });
  h+='</div><div class="sum" style="margin-top:12px"><div><span>Шанс перемоги</span><span class="'+(st.p>=50?'pos':'neg')+'">≈ '+st.p+'%</span></div><div><span>Витрати</span><span class="neg">−'+st.cost+' тис.</span></div><div class="tot"><span>Готівка після</span><span>'+Math.round(S.cash-st.cost)+' тис.</span></div></div>';
  h+='<div class="actions" style="margin-top:14px"><button class="btn primary" data-e="go"'+(S.cash<st.cost?' disabled':'')+'>Іти на вибори</button><button class="btn" data-e="skip">Не йти</button></div>';
  if(S.cash<st.cost)h+='<p class="note">Не вистачає готівки на кампанію.</p>';
  $('elect').innerHTML=h;
}
function runElection(){
  var st=electStats();
  if(S.cash<st.cost)return;
  S.cash-=st.cost;S.risk=clamp(S.risk+st.rk,0,100);
  var sup=baseSupport()+st.pts+rnd(0,12),riv=40+(S.rank===3?6:0)+rnd(0,25)-st.rv;
  $('elWrap').hidden=true;
  if(sup>riv){
    if(S.rank<3){S.rank=3;addLog('Перемога! Ти депутат Київради. Тепер ухвалюєш бюджети, яких сам же й потребуєш.','good');}
    else addLog('Переобрано. Виборці або забули, або повірили.','good');
    S.fame+=5;S.contacts+=5;
  } else {
    if(S.rank===3){S.rank=2;addLog('Програв. Мандат втрачено, повертаєшся до КП.','bad');}
    else addLog('Програв. Суперник виявився гречанішим.','bad');
  }
  E=null;genOffers();check();ui();
}

/* ---------- career & actions ---------- */
function rankUp(){
  if(S.over)return;
  if(S.rank===0&&S.cash>=100&&S.contacts>=12){
    S.cash-=30;S.rank=1;S.fops.push({name:'ТОВ «Ви і Ко»',used:0,heat:0,equip:true,isCo:true,lastUsed:0});
    addLog('Зареєстровано ТОВ. Тепер можна брати тендери.','good');
  } else if(S.rank===1&&S.cash>=300&&S.contacts>=30&&S.fame>=10){
    S.cash-=120;S.rank=2;S.risk=clamp(S.risk+4,0,100);
    addLog('Ти директор КП. Кошториси пишеш сам, а покровитель бере свою долю.','good');
  } else return;
  genOffers();ui();
}
function nextReq(){
  if(S.rank===0)return {t:'Зареєструвати ТОВ · 30 тис.',need:'Готівка ≥ 100, зв\'язки ≥ 12',ok:S.cash>=100&&S.contacts>=12};
  if(S.rank===1)return {t:'Сісти директором КП · 120 тис.',need:'Готівка ≥ 300, зв\'язки ≥ 30, слава ≥ 10',ok:S.cash>=300&&S.contacts>=30&&S.fame>=10};
  return null;
}
$('bribe').addEventListener('click',function(){
  if(S.over||S.cash<40)return;S.cash-=40;S.risk=clamp(S.risk-12,0,100);
  addLog('Журналіст раптом зацікавився котиками.','good');ui();
});
$('lawyer').addEventListener('click',function(){
  if(S.over||S.cash<90||S.rank<1)return;S.cash-=90;S.risk=clamp(S.risk-25,0,100);
  addLog('Юрист «усе врегулював». Папки зникли, зате з\'явилась нова.','good');ui();
});
$('flee').addEventListener('click',function(){if(!S.over&&S.cash>=FLEE_COST)finish('flee');});
$('speed').addEventListener('click',function(e){var b=e.target.closest('[data-sp]');if(!b||S.over)return;S.speed=+b.dataset.sp;ui();});
$('again').addEventListener('click',newGame);

/* ---------- UI ---------- */

  });
  if(S.fops.filter(function(f){return !f.isCo;}).length<6)fh+='<button class="fopb" data-fop="new"'+(S.cash<12||S.over?' disabled':'')+'><b>+ Новий ФОП на родича</b><br><small class="note" style="margin:0">12 тис. · свій ліміт '+FOP_LIMIT+' тис. на місяць</small></button>';
  $('fops').innerHTML=fh;
  var nr=nextReq(),ch='<p style="margin:0 0 6px"><b>'+RANKS[S.rank]+'</b> · слава '+S.fame+'</p>';
  if(nr)ch+='<button class="btn gold" data-career="up"'+(nr.ok&&!S.over?'':' disabled')+' style="width:100%">'+nr.t+'</button><p class="note">'+nr.need+'</p>';

/* ---------- drawing helpers ---------- */
function P(X,Y,z){return [V.ox+(X-Y)*V.kx+V.tilt*z, V.oy+(X+Y)*V.ky-z]}
function poly(pts,fill,stroke,lw){
  g.beginPath();
  for(var i=0;i<pts.length;i++){if(i)g.lineTo(pts[i][0],pts[i][1]);else g.moveTo(pts[i][0],pts[i][1]);}

}
function shade(h,k){
  var n=parseInt(h.slice(1),16),r=n>>16,gg=(n>>8)&255,b=n&255;
  function f(v){return Math.max(0,Math.min(255,Math.round(k<0?v*(1+k):v+(255-v)*k)))}
  return 'rgb('+f(r)+','+f(gg)+','+f(b)+')';
}
function box(x0,y0,x1,y1,z0,z1,col){
  poly([P(x1,y0,z0),P(x1,y1,z0),P(x1,y1,z1),P(x1,y0,z1)],shade(col,-.28));
  poly([P(x0,y1,z0),P(x1,y1,z0),P(x1,y1,z1),P(x0,y1,z1)],shade(col,-.1));
  poly([P(x0,y0,z1),P(x1,y0,z1),P(x1,y1,z1),P(x0,y1,z1)],col);
}
function circ(cx0,cy0,r,z,fill,stroke,lw){
  var pts=[];for(var i=0;i<28;i++){var a=i/28*Math.PI*2;pts.push(P(cx0+Math.cos(a)*r,cy0+Math.sin(a)*r,z));}
  poly(pts,fill,stroke,lw);
}
function ball(x,y,z,r,fill){
  var p=P(x,y,z);g.beginPath();g.arc(p[0],p[1],r,0,Math.PI*2);g.fillStyle=fill;g.fill();g.lineWidth=2.5;g.strokeStyle=INK;g.stroke();
}
function line(pts,col,lw,dash){
  g.beginPath();for(var i=0;i<pts.length;i++){if(i)g.lineTo(pts[i][0],pts[i][1]);else g.moveTo(pts[i][0],pts[i][1]);}

function rectR(x0,x1,y,z0,z1,fill){poly([P(x0,y,z0),P(x1,y,z0),P(x1,y,z1),P(x0,y,z1)],fill,INK,1.6)}   /* на лівій грані (y=const) */

var HEIGHT={H:50,S:34,P:30,R:6,Y:6,K:16,L:14,N:76};
function windows(x0,x1,y0,y1,z,rows,lit){
  for(var r=0;r<rows;r++){

/* ---------- time ---------- */
var MONTH_MS=40000,lastLabel='';
function monthLabel(){var day=Math.min(30,Math.floor(S.tick/MONTH_MS*30)+1);return 'Місяць '+S.month+' · '+MONTHS[(S.month-1)%12]+' · день '+day;}
function modalOpen(){return !$('dealWrap').hidden||!$('elWrap').hidden||!$('end').hidden;}
function tickTime(dt){
  if(!S||S.over||S.speed<=0||modalOpen())return;
  S.tick+=dt*S.speed;
  if(S.tick>=MONTH_MS)nextMonth();
  var l=monthLabel();
  if(l!==lastLabel){lastLabel=l;$('month').textContent=l;}
  $('tickbar').style.width=(S.tick/MONTH_MS*100)+'%';
}
/* ---------- loop ---------- */
var lastT=0;
function frame(now){
  var dt=lastT?Math.min(80,now-lastT):0;lastT=now;
  if(!reduce)cars.forEach(function(c){c.pos+=c.dir*c.spd*dt;if(c.dir>0&&c.pos>8.5)c.pos=-.5;if(c.dir<0&&c.pos<-.5)c.pos=8.5;});
  tickTime(dt);
  drawCity(now);drawCastle(now);
  requestAnimationFrame(frame);
}
